# Publishes the site to GitHub Pages.
# Runs on every push to main, every 3 hours (to pull fresh YouTube data), and on demand from the Actions tab.
# The fresh YouTube data is published straight to the site and is NOT committed, because main only
# accepts changes through pull requests.
name: Update YouTube data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # If YouTube can't be reached the script keeps the existing data, so a failure here never breaks the site.
      - name: Refresh YouTube data
        run: python3 tools/update_youtube.py || echo "YouTube refresh failed; keeping existing data"

      # Publish only the website files (not tools/, README, etc.)
      - name: Build site folder
        run: |
          mkdir _site
          cp -R index.html assets CNAME _site/
          # Give the stylesheet, script and data a new version on every deploy, so browsers
          # never pair a fresh page with an old cached stylesheet.
          v="${{ github.run_id }}"
          sed -i -e "s#assets/style.css\"#assets/style.css?v=$v\"#" \
                 -e "s#assets/main.js\"#assets/main.js?v=$v\"#" \
                 -e "s#assets/data/youtube.js\"#assets/data/youtube.js?v=$v\"#" _site/index.html
          grep -o 'assets/[a-z/]*\.\(css\|js\)?v=[0-9]*' _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub Pages allows one custom domain per repository, so the same build is also pushed to
      # the myvillageshow-in repository, which serves it on myvillageshow.in. Only the CNAME differs.
      # The push replaces the mirror's history with a single commit, so it stays small.
      - name: Publish the same site to myvillageshow.in
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          cp -R _site _mirror
          echo "myvillageshow.in" > _mirror/CNAME
          touch _mirror/.nojekyll
          install -m 600 /dev/null ~/mirror_key
          echo "$MIRROR_DEPLOY_KEY" > ~/mirror_key
          export GIT_SSH_COMMAND="ssh -i ~/mirror_key -o StrictHostKeyChecking=accept-new"
          cd _mirror
          git init -q -b main
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q -f git@github.com:sriramsrikanth05-hash/myvillageshow-in.git main
